name: ci

# Every commit on every branch is built and tested. The project's claims rest on
# reproducibility, so "it built on my machine" is not evidence of anything.
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned clang-format
        run: pip install clang-format==17.0.6
      - name: Check formatting
        run: ./scripts/format.sh --check

  build:
    # Two compiler families on two operating systems, each in an optimised and
    # an assertions-enabled configuration. GCC and Clang disagree about enough
    # of -Wconversion and -Wshadow that building only one of them regularly
    # hides real bugs, and Debug catches assertion failures that Release elides.
    name: ${{ matrix.name }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        preset: [release, debug]
        include:
          - name: linux-gcc-13
            os: ubuntu-latest
            cc: gcc-13
            cxx: g++-13
            apt: g++-13
          - name: linux-clang-18
            os: ubuntu-latest
            cc: clang-18
            cxx: clang++-18
            apt: clang-18
          - name: macos-appleclang
            os: macos-latest
            cc: clang
            cxx: clang++
            apt: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install compiler
        if: matrix.apt != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j

      - name: Report toolchain
        run: ./build/${{ matrix.preset }}/apps/xc_info

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
