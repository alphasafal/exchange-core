name: ci

# Every commit on every branch is built and tested. The project's claims rest on
# reproducibility, so "it built on my machine" is not evidence of anything.
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned clang-format
        run: pip install clang-format==17.0.6
      - name: Check formatting
        run: ./scripts/format.sh --check

  build:
    # Two compiler families on two operating systems, each in an optimised and
    # an assertions-enabled configuration. GCC and Clang disagree about enough
    # of -Wconversion and -Wshadow that building only one of them regularly
    # hides real bugs, and Debug catches assertion failures that Release elides.
    #
    # The toolchain is a matrix dimension rather than a list of `include`
    # entries. An `include` object whose keys are absent from the base matrix is
    # merged into *every* combination, so three of them in sequence overwrite
    # one another and only the last toolchain ever runs -- a green tick over
    # two thirds of the intended coverage.
    name: ${{ matrix.toolchain.name }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.toolchain.os }}
    strategy:
      fail-fast: false
      matrix:
        preset: [release, debug]
        toolchain:
          - name: linux-gcc-13
            os: ubuntu-latest
            cc: gcc-13
            cxx: g++-13
            apt: g++-13
          - name: linux-clang-18
            os: ubuntu-latest
            cc: clang-18
            cxx: clang++-18
            apt: clang-18
          - name: macos-appleclang
            os: macos-latest
            cc: clang
            cxx: clang++
            apt: ""
    steps:
      - uses: actions/checkout@v5

      - name: Install compiler
        if: matrix.toolchain.apt != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.toolchain.apt }}

      - name: Configure
        env:
          CC: ${{ matrix.toolchain.cc }}
          CXX: ${{ matrix.toolchain.cxx }}
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j

      - name: Report toolchain
        run: ./build/${{ matrix.preset }}/apps/xc_info

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  sanitize:
    # The suite under AddressSanitizer and UndefinedBehaviorSanitizer. These
    # catch a different class of defect from the warning set: -Wconversion sees
    # a narrowing cast, ASan sees the read past the end of a slab that the cast
    # made possible.
    #
    # Clang only, and one platform. The sanitizers are a property of the code,
    # not of the toolchain, so running them on six configurations buys six
    # copies of the same finding.
    name: ${{ matrix.preset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, ubsan]
    steps:
      - uses: actions/checkout@v5

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18

      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j

      - name: Test
        # halt_on_error is the whole point. UBSan's default is to print a
        # diagnostic and keep going, so the process exits 0 and CI goes green
        # over live undefined behaviour -- a worse outcome than not running it,
        # because it produces a badge that says the code is clean.
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_SYMBOLIZER_PATH: /usr/bin/llvm-symbolizer-18
          UBSAN_SYMBOLIZER_PATH: /usr/bin/llvm-symbolizer-18
        run: ctest --preset ${{ matrix.preset }}

  thread-sanitize:
    # ThreadSanitizer has exactly one thing in this repository to look at.
    #
    # The engine is single-threaded by design: commands arrive in a total
    # order, are matched on the thread that read them, and determinism depends
    # on that. The transport layer is single-threaded too -- the readiness loop
    # multiplexes sockets rather than spawning per-connection threads.
    #
    # The only concurrent code is bench_wire, which runs the venue on one
    # thread and the open-loop load generator on another, sharing an atomic
    # stop flag and a socket. That is a real race surface, so it gets a real
    # check; running TSan over the single-threaded suite as well would produce
    # a reassuring green tick that examined nothing.
    name: tsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18

      - name: Configure
        # Tests off: the suite is single-threaded, so the only target worth
        # building here is the one with threads in it.
        env:
          CC: clang-18
          CXX: clang++-18
        run: cmake --preset tsan -DXC_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build --preset tsan --target bench_wire -j

      - name: Check the threaded benchmark for races
        # A small workload on purpose. TSan's shadow memory makes this roughly
        # twenty times slower, and its race detection depends on the number of
        # distinct interleavings it observes, not on how long it runs.
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
          TSAN_SYMBOLIZER_PATH: /usr/bin/llvm-symbolizer-18
        run: ./build/tsan/bench/bench_wire --orders 20000 --rate 50000 --warmup 2000

  fuzz:
    # A regression gate, not a fuzzing campaign.
    #
    # Sixty seconds per target finds nothing new; it re-runs the committed
    # corpus and explores a little around it, so a change that breaks an input
    # already known to matter fails here. Real campaigns run for hours
    # somewhere else, and anything they find gets committed to fuzz/corpus/ --
    # at which point the corpus runners in the ordinary test suite catch it on
    # every platform, which is the point of keeping those separate.
    name: fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18

      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: cmake --preset fuzz

      - name: Build
        run: cmake --build --preset fuzz -j

      - name: Fuzz
        env:
          ASAN_OPTIONS: abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_SYMBOLIZER_PATH: /usr/bin/llvm-symbolizer-18
        run: |
          for target in protocol journal order_flow; do
            echo "::group::fuzz_${target}"
            ./build/fuzz/fuzz/fuzz_${target} \
              fuzz/corpus/${target} \
              -max_total_time=60 -print_final_stats=1
            echo "::endgroup::"
          done

      - name: Upload any crash found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            crash-*
            timeout-*
            oom-*
          if-no-files-found: ignore
